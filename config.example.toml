# Zoop gateway configuration (example)
#
# Matches the current `Config` schema:  Config -> bridges: list[BridgeConfig]
# Each BridgeConfig (kw_only):
#   type     : which bridge to run (registry key, e.g. "mqtt", "http")
#   id       : unique instance id (also names the log dir: logs/<type>-<id>/)
#   enabled  : default true; set false to keep a bridge defined but not started
#   options  : bridge-specific settings, validated by that bridge itself
#
# Decode with: msgspec.toml.decode(path.read_bytes(), type=Config)

[[storage]]
type = "parquet"
path = "./data" # a path or a URI to an external service.
options = {} # if using other types of storage backends


# --- An MQTT bridge: subscribe to a broker, durably append to its log ---
[[bridges]]
type    = "mqtt"
id      = "1"
enabled = true
options = { host = "localhost", port = 1883, topic = "zoop/#" }

# --- A second MQTT bridge instance (different broker / topic) ---
[[bridges]]
type    = "mqtt"
id      = "2"
enabled = false                                  # defined but not started
options = { host = "broker.internal", port = 1883, topic = "farm/+/data" }

# --- An HTTP bridge: accept POSTed payloads ---
[[bridges]]
type    = "http"
id      = "1"
options = { host = "0.0.0.0", port = 8080 }      # enabled defaults to true

# Optional runtime/path settings (all have defaults), e.g.:
#   data_dir           = "/var/lib/zoop"
#   specs_dir          = "/etc/zoop/specs"
#   segment_bytes      = 65536   # bytes per append-log segment before it seals
#   parquet_batch_rows = 1000    # readings buffered before a Parquet file is written
#   poll_interval      = 0.5
