[project]
name = "zoop"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Francisco", email = "fran.abm94@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "duckdb>=1.5.3",
    "pyarrow>=24.0.0",
    "msgspec>=0.21.1",
    "aiomqtt>=2.5.1",
]

[project.scripts]
zoop = "zoop.app:main"

[build-system]
requires = ["uv_build>=0.11.3,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.1.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.17",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "unit: fast, isolated unit tests",
    "integration: tests that touch real I/O (files, db)",
]
