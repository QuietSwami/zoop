# Zoop demo config: a fast dummy bridge driving the full ingest path end to end.
#
#   dummy bridge -> per-bridge append-log -> core drains sealed segments ->
#   coerce (specs/dummy.json) -> fan_out -> Parquet (data/) + SQLite catalog.
#
# Run with:  zoop run --config config.dummy.toml

specs_dir     = "specs"
segment_bytes = 65536    # tiny so segments seal quickly under load
poll_interval = 0.2
parquet_batch_rows = 65536 # readings buffered before a Parquet file is written

[[storage]] # the default backend is parquet, if no storage backend is provided
type = "parquet"
path = "./data" # a path or a URI to an external service.
options = {} # if using other types of storage backends

[[bridges]]
type    = "dummy"
id      = "1"
options = { source = "dummy", interval = 0.05, devices = 5 }

